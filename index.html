<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DIABLO — NES DEMAKE</title>
<style>
  html,body{margin:0;min-height:100%;background:#07070d;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;font-family:monospace;color:#b8b8c4}
  .wrap{position:relative;line-height:0}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;width:min(768px,96vw);aspect-ratio:256/240;height:auto;background:#000;border:4px solid #1a1a28;border-radius:6px;box-shadow:0 0 80px rgba(150,30,20,.18)}
  .scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,rgba(0,0,0,.16) 0 1px,transparent 1px 3px);mix-blend-mode:multiply}
  .hint{color:#78788c;font-size:13px;text-align:center;line-height:1.8;max-width:740px}
  kbd{background:#161622;border:1px solid #33334a;border-radius:4px;padding:1px 7px;color:#e8d8b8}
  .touch-controls{display:none;gap:18px;align-items:center;justify-content:center;width:min(768px,96vw);padding:10px 0 18px;box-sizing:border-box;user-select:none;-webkit-user-select:none;touch-action:none}
  .pad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,52px);gap:5px}
  .actions{display:grid;grid-template-columns:repeat(2,58px);gap:9px;align-items:center}
  .touch-controls button{width:52px;height:52px;border:2px solid #494052;border-radius:9px;background:linear-gradient(#282432,#111019);color:#f0dfc0;font:bold 17px monospace;box-shadow:0 3px 0 #08070c;touch-action:none;-webkit-tap-highlight-color:transparent}
  .touch-controls button:active{background:#59302b;transform:translateY(2px);box-shadow:0 1px 0 #08070c}
  .pad [data-key="ArrowUp"]{grid-column:2;grid-row:1}.pad [data-key="ArrowLeft"]{grid-column:1;grid-row:2}.pad [data-key="ArrowDown"]{grid-column:2;grid-row:2}.pad [data-key="ArrowRight"]{grid-column:3;grid-row:2}
  .actions button{width:58px;height:58px;border-radius:50%;font-size:18px}
  @media (pointer:coarse),(max-width:700px){.touch-controls{display:flex}.hint{font-size:11px;padding:0 8px}}
</style>
</head>
<body>
<div class="wrap">
<canvas id="screen" width="256" height="240"></canvas>
<div class="scan"></div>
</div>
<div class="hint">
  <kbd>←→↑↓</kbd>/<kbd>WASD</kbd> рух &nbsp; <kbd>Z</kbd>/<kbd>Space</kbd> атака &nbsp; <kbd>X</kbd> зілля &nbsp; <kbd>E</kbd> дія / сходи &nbsp; <kbd>Enter</kbd> старт / далі &nbsp; <kbd>M</kbd> звук<br>
  Клікніть по екрану, щоб активувати звук. Демейк Diablo (1996) під залізо NES: 256×240, світло через «attribute table», катсцени в дусі Ninja Gaiden.
</div>
<div class="touch-controls" aria-label="Сенсорне керування">
  <div class="pad">
    <button type="button" data-key="ArrowUp" aria-label="Вгору" tabindex="-1">▲</button>
    <button type="button" data-key="ArrowLeft" aria-label="Ліворуч" tabindex="-1">◀</button>
    <button type="button" data-key="ArrowDown" aria-label="Вниз" tabindex="-1">▼</button>
    <button type="button" data-key="ArrowRight" aria-label="Праворуч" tabindex="-1">▶</button>
  </div>
  <div class="actions">
    <button type="button" data-key="z" aria-label="Атака" tabindex="-1">A</button>
    <button type="button" data-key="x" aria-label="Зілля" tabindex="-1">B</button>
    <button type="button" data-key="e" aria-label="Дія або взаємодія" tabindex="-1">ACT</button>
  <button type="button" data-key="Enter" aria-label="Підтвердити або продовжити" tabindex="-1">START</button>
  </div>
</div>
<script>
function ENGINE(canvas){
"use strict";
var ctx=canvas.getContext("2d");ctx.imageSmoothingEnabled=false;
var W=256,H=240,TS=16,MW=32,MH=32;
var RAF=null,running=true,last=0,gt=0;

// ---------- RNG (mulberry32, сідований — «як на NES») ----------
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
var SEED=(Math.random()*1e9)|0;

// ---------- Палітра (наближення до NES) ----------
var P={black:"#000000",white:"#fcfcfc",lgray:"#bcbcbc",gray:"#7c7c7c",dgray:"#414141",
red:"#d82800",dred:"#881400",orange:"#fc9838",dorng:"#e45c10",yellow:"#f8b800",
skin:"#fce0a8",hair:"#503000",brown:"#a05010",green:"#58d854",dgreen:"#005800",
blue:"#3cbcfc",dblue:"#0000bc",purple:"#6844fc",pink:"#fc7460",dpink:"#a81000",wood:"#7c4a00"};

// ---------- Шрифт 3x5 ----------
var FONT={A:[2,5,7,5,5],B:[6,5,6,5,6],C:[3,4,4,4,3],D:[6,5,5,5,6],E:[7,4,6,4,7],F:[7,4,6,4,4],
G:[3,4,7,5,3],H:[5,5,7,5,5],I:[7,2,2,2,7],J:[1,1,1,5,2],K:[5,5,6,5,5],L:[4,4,4,4,7],
M:[5,7,7,5,5],N:[6,5,5,5,5],O:[2,5,5,5,2],P:[6,5,6,4,4],Q:[2,5,5,7,3],R:[6,5,6,5,5],
S:[3,4,2,1,6],T:[7,2,2,2,2],U:[5,5,5,5,7],V:[5,5,5,5,2],W:[5,5,7,7,5],X:[5,5,2,5,5],
Y:[5,5,2,2,2],Z:[7,1,2,4,7],"0":[7,5,5,5,7],"1":[2,6,2,2,7],"2":[7,1,7,4,7],"3":[7,1,7,1,7],
"4":[5,5,7,1,1],"5":[7,4,7,1,7],"6":[7,4,7,5,7],"7":[7,1,2,4,4],"8":[7,5,7,5,7],"9":[7,5,7,1,7],
".":[0,0,0,0,2],",":[0,0,0,2,4],"!":[2,2,2,0,2],"?":[6,1,2,0,2],"'":[2,4,0,0,0],
"-":[0,0,7,0,0],":":[0,2,0,2,0],">":[4,2,1,2,4],"/":[1,1,2,4,4]};
function text(s,x,y,col,sc){s=(s+"").toUpperCase();sc=sc||1;ctx.fillStyle=col;
 for(var i=0;i<s.length;i++){var g=FONT[s[i]];if(g){for(var r=0;r<5;r++){var b=g[r];
  if(b&4)ctx.fillRect(x+i*4*sc,y+r*sc,sc,sc);if(b&2)ctx.fillRect(x+i*4*sc+sc,y+r*sc,sc,sc);if(b&1)ctx.fillRect(x+i*4*sc+2*sc,y+r*sc,sc,sc)}}}}
function textC(s,y,col,sc){sc=sc||1;var w=(s.length*4-1)*sc;text(s,(W-w>>1),y,col,sc)}
function textBlip(n){if(n%2===0)sfx("blip")}

// ---------- Аудіо: 5 каналів NES (2 pulse, triangle, noise, DPCM) ----------
var actx=null,master=null,musTimer=null,musName=null,voices=null,noiseBuf=null,mute=false;
function initAudio(){if(actx)return;var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
 actx=new AC();master=actx.createGain();master.gain.value=0.55;master.connect(actx.destination);
 noiseBuf=actx.createBuffer(1,actx.sampleRate,actx.sampleRate);
 var d=noiseBuf.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1;
 musTimer=setInterval(musTick,60);if(actx.state==="suspended")actx.resume();}
function Nf(m){return 440*Math.pow(2,(m-69)/12)}
function vOsc(type,f,d,v){if(!actx||mute)return;var t=actx.currentTime,o=actx.createOscillator(),g=actx.createGain();
 o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);
 o.connect(g);g.connect(master);o.start(t);o.stop(t+d);}
function vSlide(type,f1,f2,d,v){if(!actx||mute)return;var t=actx.currentTime,o=actx.createOscillator(),g=actx.createGain();
 o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+d);
 g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d);}
function vNoise(d,v,fLow){if(!actx||mute||!noiseBuf)return;var t=actx.currentTime,s=actx.createBufferSource(),g=actx.createGain();
 s.buffer=noiseBuf;if(fLow){var fl=actx.createBiquadFilter();fl.type="lowpass";fl.frequency.value=fLow;s.connect(fl);fl.connect(g)}else s.connect(g);
 g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);g.connect(master);s.start(t);s.stop(t+d);}
function sfx(name){if(!actx||mute)return;switch(name){
 case"swing":vSlide("square",650,220,0.09,0.12);break;
 case"hit":vNoise(0.06,0.2);vOsc("square",180,0.05,0.1);break;
 case"fire":vSlide("square",300,90,0.18,0.12);vNoise(0.1,0.1,900);break;
 case"knife":vSlide("square",900,500,0.05,0.08);break;
 case"hurt":vSlide("square",200,70,0.2,0.16);break;
 case"die":vOsc("square",300,0.1,0.12);vOsc("square",150,0.3,0.12);break;
 case"gold":vOsc("square",940,0.04,0.1);vOsc("square",1240,0.06,0.08);break;
 case"pot":vSlide("square",300,700,0.15,0.1);break;
 case"stairs":vOsc("triangle",98,0.3,0.2);vOsc("triangle",147,0.3,0.2);break;
 case"blip":vOsc("square",1000,0.015,0.03);break;
 case"heart":vOsc("triangle",55,0.12,0.3);vNoise(0.1,0.12,220);break;
 case"roar":vNoise(0.5,0.3,420);vSlide("square",110,40,0.5,0.14);break;
 case"bossHit":vNoise(0.08,0.22);vOsc("square",90,0.08,0.14);break;
 case"pick":vOsc("square",600,0.05,0.1);vOsc("square",900,0.08,0.08);break;}}
var MUSIC={
 title:{spb:0.21,vol:0.05,
  lead:[[64,2],[67,2],[71,2],[76,2],[74,2],[71,2],[67,2],[64,2],[72,2],[76,2],[74,2],[71,2],[69,2],[67,4],[64,6]],
  bass:[[40,8],[38,8],[36,8],[35,12]]},
 dungeon:{spb:0.42,vol:0.045,
  lead:[[0,7],[52,2],[0,7],[55,2],[0,7],[50,2],[0,7],[48,2]],
  bass:[[28,16],[28,16]]},
 boss:{spb:0.13,vol:0.06,drum:[1,0,0,1,0,0,1,0],
  lead:[[0,4],[59,1],[0,1],[59,1],[0,2],[62,1],[0,1],[59,2],[0,4],[64,1],[0,1],[62,1],[0,2]],
  bass:[[35,2],[35,2],[35,2],[38,2],[35,2],[35,2],[37,2],[38,2]]},
 end:{spb:0.4,vol:0.05,
  lead:[[64,4],[67,4],[71,4],[69,4],[67,4],[64,4],[62,4],[59,8]],
  bass:[[40,8],[38,8],[36,8],[35,8]]}};
function setMusic(name){if(musName===name)return;musName=name;
 if(!actx||!name){voices=null;return}
 voices={lead:{t:actx.currentTime+0.1,i:0,type:"square",vol:MUSIC[name].vol},
         bass:{t:actx.currentTime+0.1,i:0,type:"triangle",vol:MUSIC[name].vol*1.7}};
 function mk(v){v.seq=v===voices.lead?MUSIC[name].lead:MUSIC[name].bass}
 mk(voices.lead);mk(voices.bass);}
function musTick(){if(!actx||!musName||!voices)return;var tr=MUSIC[musName],now=actx.currentTime;
 [voices.lead,voices.bass].forEach(function(v){var guard=0;
  while(v.t<now+0.22&&guard++<64){var ev=v.seq[v.i%v.seq.length];var d=ev[1]*tr.spb;
   if(ev[0]>0)vOsc(v.type,Nf(ev[0]),d*0.9,v.vol);
   if(v===voices.bass&&tr.drum&&tr.drum[v.i%tr.drum.length])vNoise(0.05,0.06,600);
   v.t+=d;v.i++;}});}

// ---------- Спрайти ----------
function mkSpr(rows,map){var w=rows[0].length,h=rows.length,c=document.createElement("canvas");
 c.width=w;c.height=h;var g=c.getContext("2d");
 for(var y=0;y<h;y++)for(var x=0;x<w;x++){var ch=rows[y][x];if(ch!=="."&&map[ch]){g.fillStyle=map[ch];g.fillRect(x,y,1,1)}}
 return c;}
function flipSpr(img){var c=document.createElement("canvas");c.width=img.width;c.height=img.height;
 var g=c.getContext("2d");g.translate(img.width,0);g.scale(-1,1);g.drawImage(img,0,0);return c;}

var HERO_MAP={k:P.black,r:"#d82800",s:P.skin,h:P.hair,d:P.dgray,a:"#a05010"};
function mkHero(tunic){var m={k:P.black,r:tunic,s:P.skin,h:P.hair,d:P.dgray,a:"#a05010"};
 var downA=["................",".....kkkkkk.....","....khhhhhhk....","....khhhhhhk....",".....kssssk.....",".....kskksk.....",
 ".....kssssk.....",".....kkkkkk.....","...kkrrrrrrkk...","...ksrrrrrrsk...","...ksrrrrrrsk...","...kkrrrrrrkk...",
 "....kddddddk....","....krrkkrrk....","....krrkkrrk....","....kddkkddk...."];
 var downB=downA.slice(0,13).concat(["....krrkkrrk....","...krrk..krrk...","...kddk..kddk..."]);
 var upA=downA.slice(0,2).concat(["....khhhhhhk....","....khhhhhhk....","....khhhhhhk....",".....khhhhk.....",
 ".....khhhhk.....",".....kkkkkk....."]).concat(downA.slice(8));
 var upB=upA.slice(0,13).concat(["....krrkkrrk....","...krrk..krrk...","...kddk..kddk..."]);
 var sideA=downA.slice(0,6).concat([".....ksskkk.....","....krrrrrkk....","....ksrrrrrk....","....ksrrrrrk....",
 "....kkrrrrrk....","....kddddddk....",".....krrrrk.....",".....krrkrrk....",".....kdk.kdk...."]);
 var sideB=sideA.slice(0,12).concat([".....krrrk......","....krrk.krrk...","....kdk...kdk..."]);
 return{down:[mkSpr(downA,m),mkSpr(downB,m)],up:[mkSpr(upA,m),mkSpr(upB,m)],
  side:[mkSpr(sideA,m),mkSpr(sideB,m)],sideF:null};}
var HERO=mkHero("#d82800");
function heroSkins(){var s=mkHero("#d82800");s.sideF=[flipSpr(s.side[0]),flipSpr(s.side[1])];return s}
HERO=heroSkins();
var ROGUE=(function(){var s=mkHero("#58d854");s.sideF=[flipSpr(s.side[0]),flipSpr(s.side[1])];return s})();
var SORC=(function(){var s=mkHero("#3cbcfc");s.sideF=[flipSpr(s.side[0]),flipSpr(s.side[1])];return s})();

var MON_MAP={k:P.black,r:"#d82800",y:P.yellow,s:P.skin,h:P.hair,d:P.dgray,w:P.white,p:P.purple,g:"#bcbcbc"};
var fallenA=["................","..kk......kk....","..khk....khk....","....krrrrk......","....kryryk......","....krrrrk......",
 ".....krrk.......","...kkrrrrkk.....","...ksrrrrrrsk...","....krrrrrk.....","....krrrrrk.....","....krrkkrrk....",
 "...krrk..krrk...","...kkk....kkk...","................","................"];
var fallenB=fallenA.slice(0,11).concat(["....krrkkrrk....","..krrk....krrk..","..kkk......kkk.."]);
var skelA=["................",".....kkkkkk.....","....kwwwwwwk....","....kwkwwkwk....","....kwwwwwwk....",".....kkkkkk.....",
 "...kkwwwwwwkk...","....kwwwwwk.....","....kwkwkwk.....","....kwwwwwk.....",".....kwwk.......","....kwwkwwk.....",
 "....kwk.kwk.....","....kwk.kwk.....","...kkk...kkk....","................"];
var skelB=skelA.slice(0,12).concat(["....kwwkwwk.....","...kwk...kwk....","..kkk.....kkk..."]);
var batA=["................","................","................","................","..kk........kk..",".kppk......kppk.",
 "..kppkkkkkkppk..","....kppppppk....","....kpypypk.....",".....kppppk.....","......kkkk......","................",
 "................","................","................","................"];
var batB=["................","................","................","................","................","................",
 "......kkkk......","....kppppppk....","....kpypypk.....","..kppk....kppk..",".kppk......kppk.","kkk..........kkk",
 "................","................","................","................"];
var butcherRows=["........................","........kkkkkkkk........",".......kppppppppk.......",".......kppppppppk.......",
 ".......kpyppppypk.......",".......kppppppppk.......","........kppppppk........",".......kkddddddkk........",
 "......kppppppppppk......","..kkkkppppppppppppkkkk..",".kppppppppppppppppppppk.",".kppppppppppppppppppppk.",
 ".kppppppppppppppppppppk.","..kpppppddddddppppppk...","..kpppppdbddbdpppppk....","..kppppddddddddppppk....",
 "..kpppppddddddpppppk....","...kppppddddddppppk.....","...kpppppddddpppppk......","....kppppppppppppk......",
 "....kppk....kppppk......","....kppk....kppppk......","...kdddk....kdddk.......","...kkkkk....kkkkk......."];
var MON={
 fallen:{spr:[mkSpr(fallenA,MON_MAP),mkSpr(fallenB,MON_MAP)],hp:3,spd:26,dmg:1,r:6,gold:0.35,pot:0.2},
 bat:{spr:[mkSpr(batA,MON_MAP),mkSpr(batB,MON_MAP)],hp:1,spd:42,dmg:1,r:5,gold:0.15,pot:0.1},
 skel:{spr:[mkSpr(skelA,MON_MAP),mkSpr(skelB,MON_MAP)],hp:5,spd:20,dmg:2,r:6,gold:0.45,pot:0.1},
 butcher:{spr:[mkSpr(butcherRows,MON_MAP)],hp:60,spd:30,dmg:3,r:11,gold:0,pot:0}};
function mkMonster(kind,x,y){var t=MON[kind];
 return{kind:kind,x:x,y:y,hp:t.hp,maxhp:t.hp,spd:t.spd,dmg:t.dmg,r:t.r,spr:t.spr,
  t:0,wx:0,wy:0,ph:Math.random()*6.28,aggro:false,hurt:0,dying:0,vxN:false,big:kind==="butcher"};}
var potionSpr=mkSpr(["..kkk...",".krrrk..",".krrrk..","krrrrrk.","krrrrrk.","krrrrrk.",".krrrk..","..kkk..."],{k:P.black,r:P.red});
var goldSpr=mkSpr(["........","........","........","..kkk...",".kyyyk..","kyyyyyk.","kyyyyyk.",".kkkkk.."],{k:P.black,y:P.yellow});
var soulSpr=mkSpr(["...k...","..krk..",".krrrk.","krrrrrk","krrrrrk",".krrrk.","..krk..","...k..."],{k:"#f83800",r:P.red});
var knifeSpr=mkSpr(["kkk.....","kssk....",".kssk...","..ksskk.","...kssss","..ksskk.",".kssk...","kkk....."],{k:P.black,s:"#bcbcbc"});
var fireSpr=[mkSpr(["..kk....",".kyok...","kyooik..",".yooik..","..yok...","...k....","........","........"],{k:P.black,y:P.yellow,o:P.orange,i:P.white}),
 mkSpr(["........","...kk...","..kyok..",".kyooik.","..kooik.","...kyk..","....k...","........"],{k:P.black,y:P.yellow,o:P.orange,i:P.white})];

// ---------- Тайли ----------
function mkTile(fn){var c=document.createElement("canvas");c.width=TS;c.height=TS;fn(c.getContext("2d"));return c;}
function mkTiles(fl){var rng=mulberry32(1234+fl*7);
 var floorC=mkTile(function(g){g.fillStyle=fl===2?"#4a3428":(fl===3?"#3c2020":"#3c3c44");g.fillRect(0,0,TS,TS);
  for(var i=0;i<26;i++){g.fillStyle=rng()<0.5?"#000000":"#2a2a30";g.fillRect(rng()*TS|0,rng()*TS|0,1,1)}
  g.fillStyle="#55555e";g.fillRect(0,0,TS,1);g.fillRect(0,0,1,TS);});
 var wallC=mkTile(function(g){var bc=fl===2?"#7c4a00":(fl===3?"#7c1800":"#6c6c74");
  g.fillStyle=bc;g.fillRect(0,0,TS,TS);g.fillStyle="#000000";
  g.fillRect(0,0,TS,2);g.fillRect(0,7,TS,1);g.fillRect(0,15,TS,1);
  g.fillRect(7,2,1,5);g.fillRect(3,8,1,7);g.fillRect(12,8,1,7);
  g.fillStyle="#a0a0aa";g.fillRect(0,2,TS,1);});
 function torch(f){return mkTile(function(g){g.fillStyle=fl===2?"#7c4a00":(fl===3?"#7c1800":"#6c6c74");g.fillRect(0,0,TS,TS);
  g.fillStyle="#000000";g.fillRect(0,0,TS,2);g.fillStyle="#a0a0aa";g.fillRect(0,2,TS,1);
  g.fillStyle="#503000";g.fillRect(6,8,4,6);g.fillStyle=P.yellow;g.fillRect(7,6,2,2);
  if(f){g.fillStyle=P.orange;g.fillRect(5,3,6,4);g.fillStyle=P.yellow;g.fillRect(6,4,2,2);g.fillRect(9,4,1,2)}
  else{g.fillStyle=P.orange;g.fillRect(6,3,4,5);g.fillStyle=P.yellow;g.fillRect(7,4,2,3)}});}
 var stairsC=mkTile(function(g){g.fillStyle="#000000";g.fillRect(0,0,TS,TS);

 for(var si=0;si<torches.length;si++)srcs.push({x:torches[si].x,y:torches[si].y,r:42+Math.sin(gt*9+torches[si].x)*5});
 for(var fi=0;fi<projs.length;fi++)if(projs[fi].kind==="fire")srcs.push({x:projs[fi].x,y:projs[fi].y,r:34});
 for(ty=ty0;ty<=ty0+15&&ty<MH;ty++)for(tx=tx0;tx<=tx0+16&&tx<MW;tx++){
  var cx=tx*TS+8,cy=ty*TS+8,dm=1e9;
  for(var s3=0;s3<srcs.length;s3++){var dd=Math.hypot(cx-srcs[s3].x,cy-srcs[s3].y)-srcs[s3].r;if(dd<dm)dm=dd}
  if(dm>0){var al=Math.min(0.85,dm/70);ctx.fillStyle="rgba(0,0,0,"+al.toFixed(3)+")";
   ctx.fillRect(tx*TS-camX,ty*TS-camY,TS,TS);}}

 // HUD
 ctx.fillStyle=P.black;ctx.fillRect(0,H-24,W,24);

 ctx.drawImage(potionSpr,108,H-17);text(""+player.pots,118,H-14,P.orange,1);
 text("L"+player.level+" "+player.xp+"/"+player.xpNext,145,H-14,P.blue,1);text("B"+floorN,228,H-14,P.lgray,1);
 if(msg&&msg.life>0)textC(msg.t,H-34,P.lgray,1);
 if(map.stairs&&Math.hypot(player.x-(map.stairs.x*TS+8),player.y-(map.stairs.y*TS+8))<18)textC("E: DESCEND",H-34,P.yellow,1);
 if(scene==="dead"){ctx.fillStyle="rgba(0,0,0,0.55)";ctx.fillRect(0,0,W,H);
  textC("YOU HAVE DIED",96,P.red,2);if((gt*2|0)%2)textC("PRESS ENTER",130,P.lgray,1);}
 }

 if(n>0){var shown=line.slice(0,n);text(shown,tx,y,col,sc);textBlip(n)}return n>=line.length;}

 ctx.fillRect(64,120,128,66);ctx.fillRect(72,84,16,102);ctx.fillRect(168,84,16,102);ctx.fillRect(120,78,16,108);

 ctx.fillStyle="#7c1800";ctx.fillRect(0,180,W,24); // земля
 for(var x=0;x<W;x+=3){var h=3+3*Math.abs(Math.sin(x*13.7+gt*7));
  ctx.fillStyle=P.orange;ctx.fillRect(x,182-h,3,h);
  if(Math.sin(x*7.3+gt*11)>0.4){ctx.fillStyle=P.yellow;ctx.fillRect(x,182-h,3,2)}}
 ctx.fillStyle=P.black;ctx.fillRect(0,0,W,36);ctx.fillRect(0,204,W,36);
 var done1=typeLine("THE TOWN OF TRISTRAM HAS FALLEN.",0.5,20,16,212,P.lgray,1);
 if(st>4.2)typeLine("THE CATHEDRAL ALONE REMAINS.",4.2,20,16,212,P.lgray,1);
 if(st>8)typeLine("BENEATH IT, SOMETHING STIRS.",8,20,16,212,P.lgray,1);
 if(st>12.5){scene="title";st=0;setMusic("title")}}

 var crowX=(gt*40)%(W+60)-30;drawSpr(MON.bat.spr[(gt*8|0)%2],crowX,34,false);
 text("DIABLO",38+3,64+3,"#3c0000",5);text("DIABLO",38,64,P.red,5);

 var defs=[["WARRIOR",HERO,"HP 12  SWORD"],["ROGUE",ROGUE,"HP 9   KNIVES"],["SORCERER",SORC,"HP 7   FIRE"]];

 var evs=[[0.4,"h0"],[1.3,"h1"],[2.2,"h2"],[3.1,"h3"],[3.9,"h4"],[4.5,"h5"]];
 for(var i=0;i<evs.length;i++)if(st>evs[i][0]&&!ev[evs[i][0]]){ev[evs[i][0]]=1;sfx("heart")}
 var z=st<2?0:(st<3.5?1:2);

  ctx.fillStyle=P.red;ctx.fillRect(W/2-18,H/2-24,eyeS,eyeS);ctx.fillRect(W/2+12-eyeS,H/2-24,eyeS,eyeS);
  shake=Math.max(shake,2);}
 if(st>3.9&&!ev.roar){ev.roar=1;sfx("roar");shake=6}

 else if(st<11){ // панорами: колони, герой на колінах

 else if(st<17){ // фейк-зум на обличчя

 else{ // фінал
  if(st<24){typeLine("EVIL CANNOT BE SLAIN.",17.5,14,56,96,P.white,1);
   typeLine("IT ONLY SLEEPS.",20.5,14,56,116,P.white,1);
   var hb=[[17.5,"a"],[19.5,"b"],[21.5,"c"],[23,"d"]];
   for(var i2=0;i2<hb.length;i2++)if(st>hb[i2][0]&&!ev[hb[i2][0]]){ev[hb[i2][0]]=1;sfx("heart")}}
  else{textC("THE END",92,P.red,3);if((gt*2|0)%2)textC("PRESS ENTER",140,P.lgray,1);}}}

// ---------- Головний цикл ----------
function frame(ts){if(!running)return;
 if(!last)last=ts;var dt=Math.min(0.05,(ts-last)/1000);last=ts;gt+=dt;st+=dt;
 shake=Math.max(0,shake-dt*10);
 switch(scene){
  case"intro":drawIntro();break;
  case"title":drawTitle();break;
  case"select":drawSelect();break;
  case"play":updatePlay(dt);drawPlay();break;
  case"butcher":drawButcher();break;
  case"ending":drawEnding();break;
  case"dead":drawPlay();break;}
 if(fade>0){ctx.fillStyle="rgba(0,0,0,"+fade.toFixed(2)+")";ctx.fillRect(0,0,W,H);fade-=dt*0.7;}
 RAF=requestAnimationFrame(frame);}
function stop(){running=false;if(RAF)cancelAnimationFrame(RAF);if(musTimer)clearInterval(musTimer);
 document.removeEventListener("keydown",keyDownH);document.removeEventListener("keyup",keyUpH);}
var keyDownH=function(e){key(e,true)},keyUpH=function(e){key(e,false)};
document.removeEventListener("keydown",keyDownH);document.removeEventListener("keyup",keyUpH);
document.addEventListener("keydown",keyDownH);
document.addEventListener("keyup",keyUpH);
RAF=requestAnimationFrame(frame);
return{stop:stop};}

ENGINE(document.getElementById("screen"));
